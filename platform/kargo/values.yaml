api:
  host: kargo.internal
  # TLS terminates at the platform Gateway; the API serves plain HTTP internally.
  tls:
    enabled: false
    terminatedUpstream: true
  adminAccount:
    enabled: false
  oidc:
    enabled: true
    admins:
      claims:
        email:
          - wesleyfebarretos@gmail.com
    dex:
      ## @param api.oidc.dex.enabled Whether to enable Dex as the identity provider. When set to true, the Kargo installation will include a Dex server and the Kargo API server will be configured to make the /dex endpoint a reverse proxy for the Dex server.
      enabled: true
      connectors:
        - id: github
          name: GitHub
          type: github
          config:
            clientID: Ov23cto1ueChXRpxULeK
            clientSecret: $CLIENT_SECRET
            redirectURI: https://kargo.internal/dex/callback
            orgs:
              - name: argocd-platform
      env:
        - name: CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: github-dex
              key: clientSecret
externalWebhooksServer:
  host: kargo.internal
  tls:
    enabled: false
    terminatedUpstream: true
controller:
  reconcilers:
    warehouses:
      minReconciliationInterval: 5m
