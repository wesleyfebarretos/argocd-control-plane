replicaCount: 1
mode:
  standalone:
    enabled: true
  distributed:
    enabled: false
ingress:
  enabled: false
gatewayApi:
  enabled: false
secret:
  # Just for development purposes, it allows login with rustfsadmin/rustfsadmin
  allowInsecureDefaults: true
storageclass:
  name: standard
  dataStorageSize: 10Gi
  logStorageSize: 10Gi
