apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rustfs-cert
spec:
  secretName: rustfs-tls
  issuerRef:
    kind: ClusterIssuer
    name: platform-selfsigned
  dnsNames:
    - rustfs.internal
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: rustfs
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs-listener-set
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: argocd
spec:
  parentRef:
    name: platform
    kind: Gateway
    group: gateway.networking.k8s.io
    namespace: envoy-gateway-system
  listeners:
    - name: https
      hostname: rustfs.internal
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: rustfs-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: rustfs-http-route
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: rustfs
      sectionName: https
  hostnames:
    - rustfs.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rustfs-svc
          port: 9001
          weight: 1
