apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ./bootstrap/root-app.yaml
  - certificate.yaml
  - referencegrant.yaml
helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.2.1
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
